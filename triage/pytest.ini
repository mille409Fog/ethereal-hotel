[pytest]
# Separate from backend/pytest.ini on purpose: pytest picks one config per invocation, from
# the arguments' common ancestor, so `pytest backend/ triage/` would read neither file.
# `pythonpath = .` puts triage/ on sys.path, which is how `ci_triage` and `cli` import.
testpaths = tests
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
