version: 2

# Everything in this repo is pinned exactly — npm via package-lock.json, pip via
# `==` in backend/requirements*.txt. Pins only stay safe if something proposes
# the upgrades, so Dependabot owns that job and CI (code-quality.yml) decides
# whether each one lands.
#
# Updates are grouped and weekly rather than per-package and daily: a stream of
# single-package PRs is noise nobody reads, which is how pinned repos drift.

updates:
  # ---------------------------------------------------------------------
  # Python backend
  # ---------------------------------------------------------------------
  #
  # Two directories in one entry, not two entries. The runtime pins are
  # declared twice — backend/requirements.txt for the container and CI, the
  # [project.dependencies] table in the root pyproject.toml for Vercel — and
  # backend/tests/test_dependency_pins.py fails when the two disagree. A pip
  # entry per directory would therefore propose every runtime bump as two PRs,
  # each of which fails that test on its own and neither of which can merge
  # until someone hand-edits the other file. Grouping the directories is what
  # makes a bump land as one reviewable, green change.
  - package-ecosystem: pip
    directories:
      - /backend
      - /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps-dev)'
    groups:
      python-dev:
        # ruff, mypy, pytest and friends: safe to move together, and a failure
        # here is a lint/type failure rather than a production incident.
        dependency-type: development
      python-runtime:
        dependency-type: production
        update-types: [minor, patch]

  # ---------------------------------------------------------------------
  # Angular frontend
  # ---------------------------------------------------------------------
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps-dev)'
    groups:
      angular:
        # The @angular/* packages must move in lockstep; separate PRs would
        # each fail on their own and none of them could merge.
        patterns:
          - '@angular/*'
          - '@angular-eslint/*'
          - 'angular-eslint'
      lint-and-test:
        patterns:
          - 'eslint*'
          - '@eslint/*'
          - '@typescript-eslint/*'
          - 'prettier*'
          - 'vitest'
          - '@vitest/*'
          - 'husky'
          - 'lint-staged'
          - '@commitlint/*'
      other-npm:
        patterns: ['*']
        update-types: [minor, patch]

  # ---------------------------------------------------------------------
  # GitHub Actions used by .github/workflows/
  # ---------------------------------------------------------------------
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: 'ci(deps)'
    groups:
      actions:
        patterns: ['*']
