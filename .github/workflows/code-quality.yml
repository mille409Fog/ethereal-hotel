name: Code Quality

on:
  push:
    branches: [main, develop, development-alpha]
  pull_request:
    branches: [main, develop, development-alpha]

jobs:
  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Pinned via .nvmrc so a local `npm test` measures the same coverage CI
      # does. V8 attributes function coverage differently across Node versions,
      # which is enough on its own to swing the coverage gate.
      - name: Setup Node.js (from .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Prettier check
        run: npm run format:check

      - name: Run ESLint (fails on any warning)
        run: npm run lint

      - name: Run frontend tests (fails below coverage thresholds)
        run: npm run test

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

      - name: Build application
        run: npm run build

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: dist/
          retention-days: 7

  accessibility:
    name: Accessibility (axe, keyboard, reduced motion)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js (from .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # `--only-shell` fetches the headless shell rather than full Chromium:
      # same rendering engine, no windowed browser this job would never open.
      - name: Install Playwright browser
        run: npx playwright install --with-deps --only-shell chromium

      # Builds, serves `dist/` and scans it. Runs against the production build
      # rather than `ng serve` on purpose: a dev build skips the production
      # `fileReplacements` and ships different CSS, so a dev-server scan can
      # pass while the artefact users actually load fails.
      - name: Run accessibility suite
        run: npm run a11y

      - name: Upload accessibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-a11y-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  backend:
    name: Backend (lint, types, pytest)
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.11']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        run: pip install -r requirements-dev.txt
        working-directory: backend

      # Ruff and mypy read their config from pyproject.toml at the repo root,
      # so these run from the root rather than from backend/.
      - name: Run Ruff (lint)
        run: ruff check backend/

      - name: Run Ruff (format check)
        run: ruff format --check backend/

      - name: Run mypy
        run: mypy backend/

      - name: Run pytest
        run: pytest
        working-directory: backend
