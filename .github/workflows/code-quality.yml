name: Code Quality

on:
  push:
    branches: [main, develop, development-alpha]
  pull_request:
    branches: [main, develop, development-alpha]

jobs:
  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Pinned via .nvmrc so a local `npm test` measures the same coverage CI
      # does. V8 attributes function coverage differently across Node versions,
      # which is enough on its own to swing the coverage gate.
      - name: Setup Node.js (from .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Prettier check
        run: npm run format:check

      - name: Run ESLint (fails on any warning)
        run: npm run lint

      - name: Run frontend tests (fails below coverage thresholds)
        run: npm run test

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

      - name: Build application
        run: npm run build

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: dist/
          retention-days: 7

  # CLAUDE.md is the orientation document: read first, trusted most, re-checked
  # never. That combination is how a doc map ends up pointing at files that
  # moved three commits ago. Its falsifiable claims — paths, pins, ports, counts
  # — are asserted here for the same reason the dependency lists are asserted in
  # test_dependency_pins.py. Pure node builtins, so this job installs nothing.
  docs:
    name: Docs (CLAUDE.md claims)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js (from .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Check CLAUDE.md against the repository
        run: npm run check:docs

  # One browser job for the whole Playwright suite — the smoke tests and the
  # accessibility audit — rather than one per suite. They need the identical
  # setup (npm ci, a browser download, a production build), so splitting them
  # would pay that cost twice to learn the same thing; Playwright's report
  # already attributes a failure to its spec.
  e2e:
    name: End-to-end (smoke, axe, keyboard, reduced motion)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js (from .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # `--only-shell` fetches the headless shell rather than full Chromium:
      # same rendering engine, no windowed browser this job would never open.
      - name: Install Playwright browser
        run: npx playwright install --with-deps --only-shell chromium

      # Builds, serves `dist/` and tests it. Runs against the production build
      # rather than `ng serve` on purpose: a dev build skips the production
      # `fileReplacements` and ships different CSS, so a dev-server run can pass
      # while the artefact users actually load fails. The backend is stubbed at
      # the network layer in both directions, so this job needs no services and
      # never touches the real API host.
      - name: Run end-to-end suite
        run: npm run e2e

      # `if: always()` because these only matter when the step above failed:
      # the config records a trace and a screenshot on failure, and without the
      # upload a red CI run gives you a stack trace and no way to see the page.
      - name: Upload Playwright report (traces + screenshots)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  # The accessibility work was protected by one axe scan, which catches markup
  # that is wrong and nothing that is merely slow or degraded. This job puts a
  # number on both and fails under it, so a regression shows up here rather than
  # in someone's browser. Thresholds live in lighthouserc.json, not in this
  # file: the config is what `npm run lighthouse` reads locally, and a gate you
  # cannot reproduce on your own machine is a gate you learn to ignore.
  #
  # `npx --yes @lhci/cli@<pinned>` rather than a devDependency, deliberately.
  # lighthouse pulls puppeteer-core, which pulls extract-zip, which carries an
  # open high-severity advisory with no fixed version. In the lockfile that
  # would fail `npm audit --audit-level=high` in supply-chain.yml, and the only
  # ways out are raising the floor to `critical` for every package at once or
  # carrying a permanent EXCEPTION note. Neither is worth it for a measurement
  # tool that never touches the shipped artefact: keeping it out of the
  # dependency graph costs one network fetch per run and keeps the audit gate
  # meaning what it says. The version is pinned in package.json.
  lighthouse:
    name: Budgets (Lighthouse — performance, a11y, best practices)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js (from .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # chrome-launcher finds this on PATH by itself. Naming it in its own step
      # means a runner image that stops shipping Chrome fails here, with the
      # version it could not find, instead of somewhere inside a Lighthouse run.
      - name: Show the Chrome the audit will drive
        run: google-chrome --version

      # Builds, serves dist/ on 4173 and audits `/` and `/dashboard` — the same
      # server and the same production build the Playwright suite uses, for the
      # same reason: a dev build ships different CSS and skips the production
      # fileReplacements. Three runs per URL, asserted against the median.
      - name: Run Lighthouse CI (fails below the thresholds in lighthouserc.json)
        run: npm run lighthouse

      # Only interesting when the step above failed, and then it is the only
      # thing that is: the assertion output names the audit, and the report
      # names the element or the request that caused it.
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          retention-days: 7
          if-no-files-found: ignore

  backend:
    name: Backend (lint, types, pytest)
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # 3.11 is what backend/Dockerfile runs and what ruff/mypy target.
        # 3.12 is what the hosted demo runs: Vercel's Python runtime offers
        # 3.12/3.13/3.14 and no 3.11, so the deployed function cannot match the
        # container. Testing both is what keeps that gap from being untested
        # rather than merely documented.
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        run: pip install -r requirements-dev.txt
        working-directory: backend

      # Ruff and mypy read their config from pyproject.toml at the repo root,
      # so these run from the root rather than from backend/. `api/` is the
      # Vercel deployment entrypoint — it is the code that actually serves the
      # hosted demo, so it is held to the same bar as backend/, not exempted
      # for being four statements long.
      - name: Run Ruff (lint)
        run: ruff check backend/ api/

      - name: Run Ruff (format check)
        run: ruff format --check backend/ api/

      # No path argument: `files` in pyproject.toml names both trees, and
      # passing one here would silently override it.
      - name: Run mypy
        run: mypy

      - name: Run pytest
        run: pytest
        working-directory: backend
