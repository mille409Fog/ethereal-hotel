<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!--
      Everything between the two ROUTE-META markers is rewritten per route by
      `scripts/emit-route-meta.mjs` after `ng build`, from the strings in
      `src/route-meta.json`. This file is the home page's copy and the fallback
      for any path without its own emitted HTML. Edit the JSON, not this block —
      a build regenerates it, and `npm run check:docs` fails if the two disagree.
    -->
    <!-- ROUTE-META:START -->
    <title>Jacob Miller - Senior Software Engineer</title>
    <meta
      name="description"
      content="Senior software engineer building in Angular and FastAPI. A hotel operations demo where every number on screen is read from a real database row."
    />
    <link rel="canonical" href="https://ethereal-hotel-pink.vercel.app/" />
    <meta property="og:url" content="https://ethereal-hotel-pink.vercel.app/" />
    <meta property="og:title" content="Jacob Miller - Senior Software Engineer" />
    <meta
      property="og:description"
      content="Senior software engineer building in Angular and FastAPI. A hotel operations demo where every number on screen is read from a real database row."
    />
    <meta name="twitter:title" content="Jacob Miller - Senior Software Engineer" />
    <meta
      name="twitter:description"
      content="Senior software engineer building in Angular and FastAPI. A hotel operations demo where every number on screen is read from a real database row."
    />
    <!-- ROUTE-META:END -->

    <meta name="author" content="Jacob Miller" />

    <!-- Open Graph / social preview.
         `og:image` is absolute because it has to be: Slack, LinkedIn and
         iMessage fetch it out of band, with no page to resolve a relative path
         against. Same reason the URL above is spelled out rather than left to
         `<base>`. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Jacob Miller" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:image" content="https://ethereal-hotel-pink.vercel.app/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Jacob Miller, Senior Software Engineer — Angular and FastAPI, on the site's dark red gothic card."
    />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://ethereal-hotel-pink.vercel.app/og-image.png" />
    <meta
      name="twitter:image:alt"
      content="Jacob Miller, Senior Software Engineer — Angular and FastAPI, on the site's dark red gothic card."
    />

    <!-- Icons. The `.ico` carries 16/32/48 for the tab strip and Windows; the
         SVG is preferred by browsers that support it and is the source the
         other two were rasterised from. `apple-touch-icon` is deliberately
         square and opaque — iOS applies its own mask, and a pre-rounded source
         gets clipped twice. All are generated by `scripts/gen-social-assets.mjs`. -->
    <link rel="icon" href="favicon.ico" sizes="48x48" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" sizes="any" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />

    <!-- Matches --color-bg, so mobile browser chrome extends the page rather
         than framing it in white. -->
    <meta name="theme-color" content="#1a1618" />

    <!-- Vercel Web Analytics. Same-origin by construction — Vercel serves this
         path from the deployment itself — so there is no third-party host, no
         cookie, and nothing requiring a consent banner. `docs/analytics.md`
         states what it collects and what it deliberately does not; the custom
         events go through src/app/services/analytics.service.ts, which explains
         why this is a script tag rather than the npm package.

         404s under `ng serve` and in the Playwright run, which is fine: the
         service buffers into `window.vaq` and nothing depends on the flush. -->
    <script defer src="/_vercel/insights/script.js"></script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
