<!-- ===== EXPERIENCE ===== -->
<section id="experience" class="section" appScrollReveal>
  <div class="section-inner">
    <div class="section-header">
      <span class="section-label">Work History</span>
      <h2>Professional Experience</h2>
      <p class="section-description">
        My journey through telecommunications, finance, and retail —
        building enterprise systems that serve millions of users.
      </p>
    </div>

    <div class="demo-card">
      <div class="experience-list">
        <div class="experience-entry" *ngFor="let job of jobs">
          <div class="experience-header">
            <div class="experience-title">
              <h3>{{ job.title }}</h3>
              <span class="experience-company">{{ job.company }}</span>
            </div>
            <span class="experience-period">{{ job.period }}</span>
          </div>
          <ul class="experience-bullets">
            <li *ngFor="let bullet of job.bullets">{{ bullet }}</li>
          </ul>
          <div class="experience-tech">
            <span class="tech-badge" *ngFor="let tech of job.tech">{{ tech }}</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
