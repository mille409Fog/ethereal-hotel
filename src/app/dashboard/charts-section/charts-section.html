<!-- Charts Section -->
<div class="charts-grid">
  <!-- Guests in house, nightly -->
  <div class="chart-card">
    <h3 class="chart-title">Guests In House</h3>
    <div class="chart-container">
      <canvas id="guestsChart"></canvas>
    </div>
  </div>

  <!-- Room revenue, nightly -->
  <div class="chart-card">
    <h3 class="chart-title">Room Revenue by Night</h3>
    <div class="chart-container">
      <canvas id="revenueChart"></canvas>
    </div>
  </div>

  <!-- Tonight's inventory split -->
  <div class="chart-card">
    <h3 class="chart-title">Room Inventory Tonight</h3>
    <div class="chart-container">
      <canvas id="roomMixChart"></canvas>
    </div>
  </div>
</div>
