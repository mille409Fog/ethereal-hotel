<!-- Charts Section -->
<div class="charts-grid">
  
  <!-- Main Chart -->
  <div class="chart-card">
    <h3 class="chart-title">Traffic Over Time</h3>
    <div class="chart-container" id="lineChart">
      <canvas id="trafficChart"></canvas>
    </div>
  </div>

  <!-- Bar Chart -->
  <div class="chart-card">
    <h3 class="chart-title">Performance Metrics</h3>
    <div class="chart-container" id="barChart">
      <canvas id="performanceChart"></canvas>
    </div>
  </div>

  <!-- Donut Chart -->
  <div class="chart-card">
    <h3 class="chart-title">Request Distribution</h3>
    <div class="chart-container" id="donutChart">
      <canvas id="distributionChart"></canvas>
    </div>
  </div>

</div>
