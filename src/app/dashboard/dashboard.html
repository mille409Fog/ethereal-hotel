<!-- ===== DASHBOARD =====
     `main` rather than `section`: this route renders nothing else, so without
     it the whole page counted as content outside any landmark and a screen
     reader user had no way to jump to it. -->
<main class="dashboard-section">
  <div class="dashboard-inner">
    <!-- Header Component -->
    <app-dashboard-header [status]="backendStatus()" />

    <!-- Metrics Grid Component -->
    <app-metrics-grid [metrics]="metrics()" />

    <!-- Charts Section Component -->
    <app-charts-section
      [metrics]="metrics()"
      [historicalGuests]="historicalGuests()"
      [historicalRevenue]="historicalRevenue()"
    />

    <!-- Footer Component -->
    <app-dashboard-footer />
  </div>
</main>
