<!-- ===== DASHBOARD ===== -->
<section class="dashboard-section">
  <div class="dashboard-inner">
    <!-- Header Component -->
    <app-dashboard-header [status]="backendStatus" />

    <!-- Metrics Grid Component -->
    <app-metrics-grid [metrics]="metrics" />

    <!-- Charts Section Component -->
    <app-charts-section
      [metrics]="metrics"
      [historicalGuests]="historicalGuests"
      [historicalRevenue]="historicalRevenue"
    />

    <!-- Footer Component -->
    <app-dashboard-footer />
  </div>
</section>
