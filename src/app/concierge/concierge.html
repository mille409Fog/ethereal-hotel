<!-- ===== SKILLS ===== -->
<section id="skills" class="section section-alt" appScrollReveal>
  <div class="section-inner">
    <div class="section-header">
      <span class="section-label">Technical Expertise</span>
      <h2>Skills & Technologies</h2>
      <p class="section-description">
        A comprehensive toolkit built through years of enterprise development —
        from frontend frameworks to backend systems and cloud infrastructure.
      </p>
    </div>

    <div class="demo-card">
      <div class="skills-grid">
        <div class="skill-category" *ngFor="let category of skillCategories">
          <h3 class="skill-category-title">{{ category.name }}</h3>
          <div class="skill-tags">
            <span class="skill-tag" *ngFor="let skill of category.skills">{{ skill }}</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
