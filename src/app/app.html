<!-- First focusable thing on the page, so Tab from the address bar reaches it
     before the nav. It is off-screen until focused (see .skip-to-content). -->
<a class="skip-to-content" href="#main-content">Skip to main content</a>

<app-navigation />

<!-- The `main` landmark. Without it every section here counted as "content
     outside a landmark", which is what a screen reader user navigating by
     landmark hits as a dead end — and it is the target the skip link needs.
     tabindex="-1" makes it focusable by the skip link without putting it in
     the tab order.

     Each child component already declares its own `<section id="…">`; the
     wrapper sections that used to live here duplicated those ids, so
     getElementById and every `#hash` link resolved to an empty wrapper. -->
<main id="main-content" tabindex="-1">
  <app-hero />

  <div class="gothic-divider"></div>

  <app-booking />

  <div class="gothic-divider"></div>

  <app-crm />

  <div class="gothic-divider"></div>

  <app-concierge />

  <div class="gothic-divider"></div>

  <app-resume />
</main>

<app-footer />
